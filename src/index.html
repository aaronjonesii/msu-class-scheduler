<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MSU Class Scheduler</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="assets/imgs/favicon.ico">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Rounded" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#18453B">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #18453b;
        transition: opacity 200ms ease-out;
        /* Needs no JavaScript, so the page still shows if the app can't start. */
        animation: app-splash-give-up 1ms 8s forwards;
      }

      @keyframes app-splash-give-up {
        to { opacity: 0; transform: translateY(-100%); }
      }

      #app-splash.app-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #app-splash svg {
        width: min(32vw, 128px);
        fill: #fff;
        overflow: visible;
      }

      /* The logo's pieces slot in one at a time, like classes filling a schedule. */
      #app-splash path {
        animation: app-splash-slot 1800ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite both;
      }

      #app-splash path:nth-child(2) { animation-delay: 120ms; }
      #app-splash path:nth-child(3) { animation-delay: 240ms; }
      #app-splash path:nth-child(4) { animation-delay: 360ms; }

      @keyframes app-splash-slot {
        0% { opacity: 0; transform: translateY(-140px); }
        28%, 82% { opacity: 1; transform: none; }
        100% { opacity: 0; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash path { animation: none; }
      }
    </style>
    <noscript><style>#app-splash { display: none; }</style></noscript>
  </head>
