<form [formGroup]="semesterPlanForm().formGroup">
  <mat-form-field [appearance]="formAppearance">
    <mat-label>Name</mat-label>
    <input
      matInput
      type="text"
      name="name"
      [formControl]="semesterPlanForm().nameCtrl"
    />
  </mat-form-field>

  <mat-form-field [appearance]="formAppearance">
    <mat-label>Description</mat-label>
    <textarea
      matInput
      rows="3"
      type="text"
      name="description"
      [formControl]="semesterPlanForm().descriptionCtrl"
    ></textarea>
  </mat-form-field>
</form>
